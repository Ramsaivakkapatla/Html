<!DOCTYPE html>
<html>

<head>
    <title>
        Text formatting tags
    </title>
    <style>
        .Tahoma{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 20px;
            font-weight: bold;
        }
        .button{
          background-color: rgb(66, 232, 66);
          color: white;
          border-radius: 10px;
          border: 1px solid black;
          padding: 5px;
          cursor: pointer;
        }
       .main{
           font-weight: bold;
           font-size: 20px;
           font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }

    </style>
</head>

<body>
    <p class="Tahoma">
        This is Thoma Family

    </p>
    <p>
        Biggest Deals of the year
    </p>
    <p style="color: red;">
        <i>Sales ends in Tuesday</i>
    </p>
    <p class="main">HTML main Course</p>
    <button class="button">GetStarted</button>

</body>

</html>
